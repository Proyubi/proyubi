server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: 路由由前端接管，未命中文件全部回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # JS/CSS/字体：UMI 产物文件名带 hash，内容变文件名就变，可永久 immutable
    location ~* \.(?:js|css|woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 图片/图标：public/ 下的 logo、favicon 等是固定文件名，不能用 immutable，
    # 否则改了内容浏览器也不会重新拉。改用协商缓存：每次带 ETag 校验，没变返回 304。
    location ~* \.(?:svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    # index.html 不缓存（保证发新版能立刻生效）
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # .pen ビューア（iframe）の入口も同じく不缓存，否则发新版后仍加载旧 bundle
    location = /pen-viewer/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 隐藏 nginx 版本号
    server_tokens off;
}
