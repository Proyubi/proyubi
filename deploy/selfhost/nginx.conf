# 自托管（docker-compose.yml）用：web 容器同时把 /api、/mock 反代到 server，浏览器只看到一个域。
server {
    listen 80;
    server_name _;
    client_max_body_size 55m;   # モックアップ zip 50MB + multipart 开销

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://server:38082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # モックアップ原文（CSP sandbox 付きで server が返す）
    location /mock/ {
        proxy_pass http://server:38082/mock/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /pen-viewer/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    server_tokens off;
}
